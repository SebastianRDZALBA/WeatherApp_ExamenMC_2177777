<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
  integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">

  <!-- The core Firebase JS SDK is always required and must be listed first -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>

:root {
      --bg-image: url('https://i.redd.it/found-these-and-they-have-been-making-great-wallpapers-for-v0-gy6dnp6juo0a1.jpg?width=1168&format=pjpg&auto=webp&s=a2e4e011825bd82ba167808b7f212a57c28606b0');
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
 
    body {
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
 
    .img {
      height: 10px;
      width: 10px;
      margin-top: 32px;
      margin-left: 32px;
      fill: white;
    }
 
    svg {
      width: 10px;
      height: 10px;
    }
 
    svg:hover {
      fill: red;
    }
 
    .slider {
      height: 70px;
 
    }
 
    .temperatura {
      height: 200px;
      margin-bottom: 80px;
      width: 350px;
      position: relative;
      background-color: rgba(230, 225, 211, 0.88);
      border: 1px solid #1A1A1A;
      border-radius: 20px;
      padding: 10px;
      background-size: cover;
      background-repeat: no-repeat;
      box-shadow: 0px 7px 30px 2px rgba(0, 0, 0, 0.18);
      vertical-align: middle;
 
    }
 
    .temperatura h3,
    .temperatura .subtitulo {
      color: #0D0D0D !important;
    }

    .altitud {
      height: 200px;
      margin-bottom: 80px;
      width: 350px;
      position: relative;
      background-color: rgba(198, 40, 40, 0.90);
      border: 1px solid #E6E1D3;
      border-radius: 20px;
      padding: 10px;
      background-size: cover;
      background-repeat: no-repeat;
      box-shadow: 0px 7px 30px 2px rgba(0, 0, 0, 0.18);
      vertical-align: middle;
    }
 
    .altitud h3,
    .altitud .subtitulo {
      color: #FFFFFF !important;
    }
 
    .presion {
      height: 200px;
      margin-bottom: 80px;
      width: 350px;
      position: relative;
      background-color: rgba(18, 18, 18, 0.85);
      border: 1px solid #E6E1D3;
      border-radius: 20px;
      padding: 10px;
      background-size: cover;
      background-repeat: no-repeat;
      box-shadow: 0px 7px 30px 2px rgba(0, 0, 0, 0.18);
      vertical-align: middle;
    }
 
    .presion h3,
    .presion .subtitulo {
      color: #E6E1D3 !important;
    }
 
    /* Customize the label (the container) */
    .container {
      display: block;
      position: relative;
      padding-left: 35px;
      margin-bottom: 12px;
      cursor: pointer;
      font-size: 22px;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
 
    /* Hide the browser's default radio button */
    .container input ~.form-check-input{
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }
 
    /* Create a custom radio button */
    .checkmark {
      position: absolute;
      top: 0;
      left: 0;
      height: 25px;
      width: 25px;
      background-color: #eee;
      border-radius: 50%;
    }
 
    .form-check-label {
      padding-left: 20px;
    }
 
    /* On mouse-over, add a grey background color */
    .container:hover input~.checkmark {
      background-color: #ccc;
    }
 
 
    /* When the radio button is checked, add a blue background */
    .container input:checked~.checkmark {
      background-color: #2196F3;
    }
 
    .container input:checked~#checkmark1 {
      background-color: #4CBB17;
    }
 
    .container input:checked~#checkmark2 {
      background-color: #FCE205;
    }
 
    .container input:checked~#checkmark3 {
      background-color: #E60000;
    }
 
    /* Create the indicator (the dot/circle - hidden when not checked) */
    .checkmark:after {
      content: "";
      position: absolute;
      display: none;
    }
 
    /* Show the indicator (dot/circle) when checked */
    .container input:checked~.checkmark:after {
      display: block;
    }
 
    /* Style the indicator (dot/circle) */
    .container .checkmark:after {
      top: 9px;
      left: 9px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
    }
    
     .weather-title {
      font-family: 'Black Ops One', 'Arial Narrow', Arial, sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #FFFFFF;
      display: inline-block;
      background-color: rgba(10, 10, 10, 0.82);
      padding: 10px 30px;
      border: 1px solid #E6E1D3;
      border-radius: 6px; 
      box-shadow: 0 0 18px rgba(211, 47, 47, 0.35);
      -webkit-text-stroke: 0.5px #000000;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
    }

    .semaforo {
      height: 80px;
      background: #E6E6E6;
    }
 
    .servo {
      height: 80px;
      background: #EBF5FB;
    }
  </style>
  <title>weatherweb</title>
</head>

<body>
  <div id="app"></div>
  <div class="container">
    <div class="row justify-content-around">
      <div class="col-12 col-md-10 col-lg-10 slider text-center">
        <h4 class="text-center fw-bold weather-title">Weather Station</h4>
      </div>
    </div>
    <div class="row justify-content-around">
      <div class="temperatura d-flex align-items-center ">
        <div class="subCategoria ">
          <h3 class="subtitulo text-white">Temperatura</h3>
          <h3 id="TemperaturaId" class="text-white"></h3>
        </div>
      </div>

      <div class="presion d-flex align-items-center">
        <div class="subCategoria ">
          <h3 class="subtitulo text-white">Presion</h3>
          <h3 id="PresionId" class="text-white"></h3>
        </div>
      </div>

      <div class="altitud d-flex align-items-center">
        <div class="subCategoria ">
          <h3 class="subtitulo text-white">Altitud</h3>
          <h3 id="AltitudId" class="text-white"></h3>
        </div>
      </div>
    </div>
  </div>
</div>
